# The gate off the author's machine. Linux runs what ./check.sh runs but `claude plugin validate`,
# whose CLI no runner has, with Chromium installed so the `browser` tests run rather than skip;
# Windows runs the tests marked `portable`, the ones that must pass there too. Nothing here pushes:
# it runs on the branch pushes close, release and /sdlc:publish make (not on the tag pushed after,
# which names a commit already checked), or by hand on a branch someone pushed
# (`gh workflow run check.yml --ref <branch>`).
name: check

on:
  push:
    branches: ['**']
  workflow_dispatch:

# The token reads and nothing more: every step checks out, installs or runs tests, none pushes,
# uploads or comments, and setup-uv's cache goes through the runner's own cache token, not this one.
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: uv run --group dev ruff check .
      - run: uv run --group dev ruff format --check .
      - run: uv run --group dev playwright install --with-deps --only-shell chromium
      - run: uv run --group dev pytest -q -n auto

  windows:
    runs-on: windows-latest
    defaults:
      run:
        # Git for Windows' bash, which Claude Code runs the skills in there.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: uv run --group dev pytest -q -m portable
