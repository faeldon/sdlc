# The plugin's shims: code kept working for something older, and the version that removes each.
# `release.deprecations` names this file; `/sdlc:release` refuses to cut a version that would still
# carry one, and `/sdlc:status` lists those due. A path kept for good is not a shim and has no
# entry here: the no-manifest drift, and whatever reads what history holds, which never migrates.
# A RETIRED_KEYS entry is a shim, its drift note removed with the rest.
#
# [[shim]]
# name = "old-flag"                       # unique
# remove_in = "2.0.0"                     # quoted X.Y.Z: the release that no longer carries it
# where = "scripts/sdlc.py load_config"   # where the shim is
# test = "tests/test_sdlc.py::test_old_flag_still_reads"   # optional: the test that goes with it
