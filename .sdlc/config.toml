# The sdlc plugin run on its own repo. Only the keys that differ from their defaults;
# `sdlc.py config` shows every setting as resolved.

[commands]
# The whole gate: ruff, the formatter check, pytest (test_adoption's bare-repo run and
# test_archive's fake `gh` included, so it stays offline) and `claude plugin validate --strict`.
check = "./check.sh"

[docs]
# The invariants live in AGENTS.md under "Invariants the tests enforce". The root CLAUDE.md only
# imports it (`@AGENTS.md`), so pinned here: the policy is the file that holds them.
policy = "AGENTS.md"
# A diff that changes what sdlc.py reads or does can make any of these false: the README (what a
# user does), docs/REFERENCE.md (every key and default) and docs/CONTRIBUTING.md (how it's built).
context = ["AGENTS.md", "README.md", "docs/REFERENCE.md", "docs/CONTRIBUTING.md"]

[archive]
# Numbered by GitHub issues on faeldon/sdlc, and archived to them.
target = "github"

[git]
# Nothing public names the agent (AGENTS.md): .claude/settings.json hides the harness's lines.
attribution = false

[review]
# Changes here get the deep review. The manifests decide what installs. The shared settings hold
# the permissions and attribution. The trackers touch a host's GitHub. check.sh and the workflows
# are the gates themselves, local and CI. Close, the push, the main lock and the factory's landing
# are where a mistake costs a host's work or history.
sensitive = [
  ".claude-plugin/",
  ".claude/settings.json",
  "scripts/trackers/",
  "check.sh",
  ".github/workflows/",
  "scripts/closing.py",
  "plugins/factory/scripts/landing.py",
  "plugins/factory/scripts/autopilot.py",
]
# What setup copies into a host: a revert here never reaches a host that already ran setup.
irreversible = ["defaults/", "templates/"]

[release]
# The plugins' version lives in their manifests and in pyproject.toml, bumped together: sdlc and
# the optional sdlc-factory always release as one version.
version_files = [
  ".claude-plugin/plugin.json",
  "plugins/factory/.claude-plugin/plugin.json",
  "pyproject.toml",
]
# uv.lock records pyproject.toml's version, so it's regenerated in the release commit; otherwise
# every `uv run` after a release rewrites it.
after_bump = "uv lock"

[retro]
# Reported bugs per release window for the product pass: issues labelled `bug`, not `sdlc`, split
# by `area: setup`, `area: new` and `area: close` (O1) and `lost-work` (O2). Stops (O3) are
# already in retro's own metrics.
evidence = ["uv run --quiet --script .sdlc/evidence.py"]
# Function-level hotspots for the architecture pass: each top-level function in the four scripts,
# with the commits since the last retrospective that rewrote some of it and its size, read from
# the base branch. Then comment health for the Quality pillar, Cost its guardrail: each script's
# comment density and the files outside 0.10-0.40, docstring coverage of long and hot functions,
# the share of comments that narrate their line, and comments' share of the scripts' bytes.
indicators = [
  "uv run --quiet --script .sdlc/function-heat.py",
  "uv run --quiet --script .sdlc/comment-health.py",
]
# Per-test run times for the pruning pass: the suite run once, its JUnit report printed alone on
# stdout. The report goes to a temp file, so the tree stays clean for `retro-commit`; pytest's own
# output goes to /dev/null, and `;` lets a red suite still print its times.
test_times = ['f=$(mktemp); uv run --group dev pytest -q -n auto --junitxml="$f" >/dev/null 2>&1; cat "$f"; rm -f "$f"']
# The suite is `tests/` alone. The conventions also count a `spec` directory, which here is the
# spec skill's (`skills/spec/`, `evals/spec/`), not a test.
test_paths = ["tests/"]
