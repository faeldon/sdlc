<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change board</title>
<!--
  The dashboard `sdlc.py board` serves. Self-contained: no external script, font or stylesheet.
  It polls /state.json and builds every node with textContent, never by parsing a string as HTML,
  so nothing a change folder holds can become markup.
-->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #dde1e6;
  --accent: #2f5fd0; --pass: #1f7a4a; --pass-bg: #e3f4ea; --changes: #a1520f; --changes-bg: #fcefdf;
  --stop: #b3261e; --stop-bg: #fbe5e3; --ready-bg: #e6eefc; --chip: #eef0f3;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #1a1e24; --ink: #e6e9ee; --muted: #9aa4b2; --line: #2c323b;
    --accent: #7aa2ff; --pass: #6fd39b; --pass-bg: #163325; --changes: #f2b36b; --changes-bg: #3a2a16;
    --stop: #ff8a80; --stop-bg: #3d1b19; --ready-bg: #1b2a47; --chip: #252b33;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 2;
}
h1 { margin: 0; font-size: 17px; }
.status { color: var(--muted); font-size: 13px; }
.status.down { color: var(--stop); }
main.board {
  display: grid; grid-template-columns: repeat(6, minmax(168px, 1fr)); gap: 12px;
  padding: 16px; overflow-x: auto; align-items: start;
}
@media (max-width: 760px) {
  main.board { grid-template-columns: 1fr; overflow-x: visible; }
}
.col { min-width: 0; }
/* Two rows: the heading and its count, then the subtitle under the heading, at every width. */
.col-head {
  display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 6px;
  margin: 0 0 8px; padding: 0 2px;
}
.col-head h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
.col-head .who { grid-column: 1 / -1; grid-row: 2; color: var(--muted); font-size: 12px; }
.col-head .count { grid-column: 2; grid-row: 1; color: var(--muted); font-size: 12px; }
.col.needs-you .col-head h2 { color: var(--stop); }
.col.ready .col-head h2, .col.landing .col-head h2 { color: var(--accent); }
.empty { color: var(--muted); padding: 8px 2px; }
.card {
  display: block; width: 100%; text-align: left; font: inherit; color: inherit;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; margin: 0 0 8px; box-shadow: var(--shadow); cursor: pointer;
}
.card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
.card.needs-you { border-left: 3px solid var(--stop); }
.card.ready { border-left: 3px solid var(--accent); background: var(--ready-bg); }
.card-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.num { font-weight: 600; font-variant-numeric: tabular-nums; }
.badge {
  font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--chip); color: var(--muted);
}
.badge.factory { color: var(--accent); }
.badge.gate-green { color: var(--accent); }
.badge.gate-red { color: var(--stop); }
.badge.rebasing { color: var(--changes); }
.badge.answered { color: var(--accent); }
.title { margin: 4px 0 6px; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.next { margin-top: 6px; font-size: 12px; }
.next code { font-size: 12px; overflow-wrap: anywhere; }
.needs { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--stop); overflow-wrap: anywhere; }
.flag { font-size: 12px; color: var(--stop); margin-top: 6px; overflow-wrap: anywhere; }
.rounds { margin-top: 6px; display: grid; gap: 4px; }
.round { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.round .r { color: var(--muted); font-size: 11px; width: 22px; }
.chip {
  font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--chip);
  font-variant-numeric: tabular-nums;
}
.chip.PASS { background: var(--pass-bg); color: var(--pass); }
.chip.CHANGES { background: var(--changes-bg); color: var(--changes); }
.chip.missing { color: var(--muted); }
.progress { margin-top: 6px; display: grid; gap: 4px; }
.track { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
.track .r { color: var(--muted); font-size: 11px; margin-right: 2px; }
.step {
  font-size: 11px; padding: 1px 5px; border-radius: 4px; border: 1px solid transparent;
  font-variant-numeric: tabular-nums;
}
.step.done { background: var(--pass-bg); color: var(--pass); }
.step.current { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.step.paused { border-color: var(--stop); border-style: dashed; color: var(--stop); }
.step.stopped { background: var(--stop-bg); border-color: var(--stop); color: var(--stop); font-weight: 600; }
.step.todo { background: var(--chip); color: var(--muted); }
.bar { height: 4px; border-radius: 2px; background: var(--chip); overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 3; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(880px, 100%); z-index: 4;
  background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column;
}
.d-head { display: flex; gap: 10px; align-items: baseline; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.d-head h3 { margin: 0; font-size: 15px; overflow-wrap: anywhere; flex: 1 1 240px; }
.d-head a { color: var(--accent); }
.d-close {
  font: inherit; font-size: 20px; line-height: 1; background: none; border: 0; color: var(--muted);
  cursor: pointer; padding: 2px 6px;
}
.d-body { display: flex; min-height: 0; flex: 1; }
.files { width: 220px; flex: none; overflow-y: auto; border-right: 1px solid var(--line); padding: 8px 0; }
.files button {
  display: block; width: 100%; text-align: left; font: 12px/1.4 ui-monospace, Menlo, monospace;
  background: none; border: 0; color: var(--ink); padding: 4px 12px; cursor: pointer; overflow-wrap: anywhere;
}
.files button[aria-current="true"] { background: var(--chip); color: var(--accent); }
.doc { flex: 1; overflow: auto; padding: 12px 16px; margin: 0; }
.doc:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.doc pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 ui-monospace, Menlo, monospace; }
.d-raw {
  font: inherit; font-size: 12px; background: var(--chip); color: var(--ink); border: 1px solid var(--line);
  border-radius: 4px; padding: 2px 8px; cursor: pointer;
}
.d-raw[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
/* A markdown file, rendered: read as prose, its code and tables scrolling inside themselves. */
.md { max-width: 72ch; overflow-wrap: anywhere; line-height: 1.55; }
.md > :first-child { margin-top: 0; }
.md h4, .md h5, .md h6 { margin: 1.2em 0 .4em; line-height: 1.3; }
/* Never above the drawer's own 15px title, which names the change. */
.md .md-h1 { font-size: 15px; }
.md .md-h2 { font-size: 14.5px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.md .md-h3 { font-size: 14px; }
.md .md-h4, .md .md-h5, .md .md-h6 { font-size: 13.5px; color: var(--muted); }
.md p, .md ul, .md ol, .md blockquote, .md .md-table { margin: 0 0 .8em; }
.md ul, .md ol { padding-left: 1.4em; }
.md li > ul, .md li > ol { margin: .2em 0; }
.md li.md-task { list-style: none; }
.md li.md-task input { margin: 0 .4em 0 -1.3em; vertical-align: -1px; }
.md a { color: var(--accent); }
.md .md-refused { text-decoration: underline dotted; text-underline-offset: 2px; }
.md code { font-size: 12.5px; background: var(--chip); border-radius: 3px; padding: 0 3px; }
.md pre.md-code {
  margin: 0 0 .8em; padding: 8px 10px; background: var(--chip); border-radius: 6px;
  white-space: pre; overflow-x: auto; overflow-wrap: normal;
}
.md pre.md-code code { background: none; padding: 0; }
.md pre.md-front { margin: 0 0 1em; padding: 6px 10px; border-left: 3px solid var(--line); color: var(--muted); }
.md blockquote { padding: 0 0 0 10px; border-left: 3px solid var(--line); color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
.md .md-table { overflow-x: auto; }
.md .md-table:focus-visible, .md pre.md-code:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; overflow-wrap: normal; }
.md th { background: var(--chip); }
@media (max-width: 760px) {
  .d-body { flex-direction: column; }
  .files { width: auto; max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1 id="repo">Change board</h1>
  <span class="status" id="status" aria-live="polite">connecting…</span>
  <span class="status" id="polled"></span>
  <span class="status" id="totals"></span>
</header>
<main class="board" id="board"></main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden>
  <div class="d-head">
    <h3 id="d-title"></h3>
    <span id="d-links"></span>
    <button class="d-raw" id="d-raw" type="button" aria-pressed="false" hidden>Raw</button>
    <button class="d-close" id="d-close" aria-label="Close">×</button>
  </div>
  <div class="d-body">
    <nav class="files" id="d-files" aria-label="Files"></nav>
    <div class="doc" tabindex="0" role="region" aria-label="File contents" id="d-pane"><div id="d-doc"></div></div>
  </div>
</aside>
<script>
"use strict";
const POLL_MS = 2000;
const COLUMNS = [
  { key: "planned", label: "Planned", who: "intent, nothing built" },
  { key: "designing", label: "Designing", who: "a Tier 2's spec" },
  { key: "building", label: "Building", who: "code, by hand or in rounds" },
  { key: "ready", label: "Ready", who: "built and checked, not committed" },
  { key: "landing", label: "Landing", who: "committed, on its way to the base" },
  { key: "needs-you", label: "Needs you", who: "what each card says it needs" },
];
const $ = (id) => document.getElementById(id);
// The width the CSS stacks the columns at.
const NARROW = window.matchMedia("(max-width: 760px)");

// Stacked, the column that waits on the person leads, in the DOM as on screen, so Tab and a
// screen reader meet it first too; the desktop grid keeps stage order.
function columnOrder() {
  return NARROW.matches
    ? [...COLUMNS.filter((c) => c.key === "needs-you"), ...COLUMNS.filter((c) => c.key !== "needs-you")]
    : COLUMNS;
}

// Every node is made here, its text set with textContent: nothing from the state is parsed as HTML.
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

// ---- markdown: a change's .md file, as the drawer shows it. Every node is made by h(), its text
// a text node: a tag in the file shows as the text it is, and a link is followed only to the web
// (in a new tab) or to another file of the change (in the drawer); any other is its words alone.

// A relative link from the file at `base`, as a path in the change's folder, or null for one with
// a scheme, an absolute path, or a way out of the folder.
function mdResolve(base, url) {
  const path = url.split(/[?#]/)[0];
  if (!path || /^[a-z][\w+.-]*:/i.test(path) || path.startsWith("/") || path.startsWith("\\")) return null;
  const parts = base.split("/").slice(0, -1);
  for (const seg of path.split("/")) {
    if (seg === "..") { if (!parts.length) return null; parts.pop(); }
    else if (seg && seg !== ".") parts.push(seg);
  }
  return parts.join("/");
}

function mdLink(label, url, ctx) {
  const words = mdInline(label, ctx);
  if (/^(https?:\/\/|mailto:)/i.test(url)) {
    return h("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, words);
  }
  const path = mdResolve(ctx.base, url);
  if (path && ctx.files.includes(path)) return h("a", { href: "#", "data-path": path }, words);
  return h("span", { class: "md-refused", title: `not followed: ${url}` }, words);
}

// The inline pass: code first, so nothing inside backticks is read as markup; then links,
// strong, struck and emphasised text, each read again inside. `_` emphasis only between words'
// edges, so snake_case stays as written.
const MD_INLINE = /`([^`]+)`|\[([^\]]+)\]\(([^)\s]+)\)|\*\*(.+?)\*\*|__(.+?)__|~~(.+?)~~|\*([^*\s](?:[^*]*[^*\s])?)\*|(?<!\w)_([^_\s](?:[^_]*[^_\s])?)_(?!\w)/g;

function mdInline(text, ctx) {
  const out = [];
  let at = 0;
  for (const m of text.matchAll(MD_INLINE)) {
    if (m.index > at) out.push(text.slice(at, m.index));
    if (m[1] !== undefined) out.push(h("code", {}, m[1]));
    else if (m[2] !== undefined) out.push(mdLink(m[2], m[3], ctx));
    else if (m[4] !== undefined || m[5] !== undefined) out.push(h("strong", {}, mdInline(m[4] ?? m[5], ctx)));
    else if (m[6] !== undefined) out.push(h("del", {}, mdInline(m[6], ctx)));
    else out.push(h("em", {}, mdInline(m[7] ?? m[8], ctx)));
    at = m.index + m[0].length;
  }
  if (at < text.length) out.push(text.slice(at));
  return out;
}

const MD_ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const MD_FENCE = /^\s*(```|~~~)/;
const MD_HEADING = /^(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/;
const MD_RULE = /^\s*([-*_])(\s*\1){2,}\s*$/;
const MD_DELIM = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
const indentOf = (line) => line.match(/^\s*/)[0].length;
const isTable = (lines, i) => lines[i].includes("|") && i + 1 < lines.length && MD_DELIM.test(lines[i + 1]);
const startsBlock = (lines, i) => MD_ITEM.test(lines[i]) || MD_FENCE.test(lines[i]) || MD_HEADING.test(lines[i]) ||
  MD_RULE.test(lines[i]) || /^\s*>/.test(lines[i]) || lines[i].startsWith("<!--") || isTable(lines, i);
const cells = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());

// A list from its first item at lines[i]: items at its indent and kind, each with the lines under
// it (wrapped text, a nested list) read again as blocks. Returns the list and the line after it.
function mdList(lines, i, ctx) {
  const first = lines[i].match(MD_ITEM);
  const base = first[1].length, ordered = /\d/.test(first[2]);
  const items = [];
  while (i < lines.length) {
    const line = lines[i];
    const m = line.match(MD_ITEM);
    if (m && m[1].length <= base + 1) {
      if (/\d/.test(m[2]) !== ordered) break;
      items.push({ marker: m[2], body: [m[3]], pad: m[1].length + m[2].length + 1 });
      i++;
    } else if (!line.trim()) {
      const next = lines[i + 1];
      const goesOn = next !== undefined && next.trim() && (indentOf(next) > base ||
        (MD_ITEM.test(next) && /\d/.test(next.match(MD_ITEM)[2]) === ordered));
      if (!goesOn) break;
      items[items.length - 1].body.push("");
      i++;
    } else if (indentOf(line) > base || !startsBlock(lines, i)) {
      const item = items[items.length - 1];
      item.body.push(line.slice(Math.min(indentOf(line), item.pad)));
      i++;
    } else break;
  }
  const start = ordered ? parseInt(items[0].marker, 10) : 1;
  const list = h(ordered ? "ol" : "ul", { start: start !== 1 ? start : null }, items.map((it) => {
    const task = it.body[0].match(/^\[([ xX])\]\s+(.*)$/);
    if (task) it.body[0] = task[2];
    const blocks = mdBlocks(it.body, ctx);
    const box = task ? h("input", { type: "checkbox", disabled: true, checked: task[1] !== " " }) : null;
    // A tight item's text sits in the item, not in a paragraph of its own; a task's sits in the
    // checkbox's label, so a screen reader names the box by it.
    const tight = blocks[0] && blocks[0].tagName === "P";
    if (tight) blocks.splice(0, 1, ...(box ? [h("label", {}, box, [...blocks[0].childNodes])] : blocks[0].childNodes));
    return h("li", { class: task ? "md-task" : null }, tight ? null : box, blocks);
  }));
  return [list, i];
}

function mdBlocks(lines, ctx) {
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if (!line.trim()) { i++; continue; }
    if ((m = line.match(MD_FENCE))) {
      const body = [];
      for (i++; i < lines.length && !lines[i].trim().startsWith(m[1]); i++) body.push(lines[i]);
      i++;
      // A box that scrolls sideways is a named tab stop, so a keyboard can scroll it too.
      out.push(h("pre", { class: "md-code", tabindex: 0, role: "region", "aria-label": "code" },
        h("code", {}, body.join("\n"))));
    } else if (line.startsWith("<!--")) {
      // A comment the file's author left: hidden, as any renderer hides it; the raw view shows it.
      while (i < lines.length && !lines[i].includes("-->")) i++;
      i++;
    } else if ((m = line.match(MD_HEADING))) {
      // The drawer's title is an h3, so the file's # is an h4.
      out.push(h(`h${Math.min(m[1].length + 3, 6)}`, { class: `md-h${m[1].length}` }, mdInline(m[2], ctx)));
      i++;
    } else if (MD_RULE.test(line)) {
      out.push(h("hr", {}));
      i++;
    } else if (/^\s*>/.test(line)) {
      const body = [];
      for (; i < lines.length && /^\s*>/.test(lines[i]); i++) body.push(lines[i].replace(/^\s*>\s?/, ""));
      out.push(h("blockquote", {}, mdBlocks(body, ctx)));
    } else if (MD_ITEM.test(line)) {
      const [list, next] = mdList(lines, i, ctx);
      out.push(list);
      i = next;
    } else if (isTable(lines, i)) {
      const head = cells(line), rows = [];
      for (i += 2; i < lines.length && lines[i].includes("|") && lines[i].trim(); i++) rows.push(cells(lines[i]));
      out.push(h("div", { class: "md-table", tabindex: 0, role: "region", "aria-label": "table" }, h("table", {},
        h("thead", {}, h("tr", {}, head.map((c) => h("th", {}, mdInline(c, ctx))))),
        h("tbody", {}, rows.map((r) => h("tr", {}, r.map((c) => h("td", {}, mdInline(c, ctx)))))))));
    } else {
      const body = [line.trim()];
      for (i++; i < lines.length && lines[i].trim() && !startsBlock(lines, i); i++) body.push(lines[i].trim());
      out.push(h("p", {}, mdInline(body.join(" "), ctx)));
    }
  }
  return out;
}

// ctx: `base`, the file's path in the change's folder, and `files`, the folder's files.
function renderMarkdown(text, ctx) {
  const lines = text.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  // Frontmatter, as written: keys and values, set apart from the document.
  if (lines[0] === "---") {
    const end = lines.indexOf("---", 1);
    if (end > 0) {
      out.push(h("pre", { class: "md-front" }, lines.slice(1, end).join("\n")));
      lines.splice(0, end + 1);
    }
  }
  return out.concat(mdBlocks(lines, ctx));
}
// ---- end markdown

function ago(seconds) {
  if (seconds === null || seconds === undefined) return "never touched";
  const m = Math.max(Math.floor(seconds / 60), 0);
  if (m < 60) return `touched ${m}m ago`;
  return m < 1440 ? `touched ${Math.floor(m / 60)}h ago` : `touched ${Math.floor(m / 1440)}d ago`;
}

function money(cost) {
  if (!cost) return "cost —";
  const mins = cost.duration_ms ? ` · ${Math.round(cost.duration_ms / 60000)} min` : "";
  return `$${cost.usd.toFixed(2)} API-equivalent${mins}`;
}

function roundRow(r) {
  // `B` for a build round: `R` is a requirement's letter, and the ledger's for the person's words.
  const chips = [h("span", { class: "r" }, `B${r.round}`)];
  chips.push(h("span", { class: "chip", title: "builder report" }, r.built ? "build" : "build …"));
  for (const [role, v] of Object.entries(r.reviews)) {
    const text = v.verdict === "CHANGES" ? `${role} ${v.changes}` : role;
    chips.push(h("span", { class: `chip ${v.verdict}`, title: `${role}: ${v.verdict}` }, text));
  }
  if (r.verified) {
    chips.push(h("span", { class: "chip", title: "the verifier kept / dropped" },
      `verifier: kept ${r.verified.kept} · dropped ${r.verified.dropped}`));
  }
  return h("div", { class: "round" }, chips);
}

function dur(seconds) {
  if (seconds < 60) return `${seconds}s`;
  const m = Math.round(seconds / 60);
  return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
}

// How far a factory run has got: the round's six steps, the current one's time against what it
// typically takes (an estimate, never drawn past the server's cap), and the plan's files touched.
// A landing's track is the same row, labelled with its landing round, the base branch's moves it
// has followed out of its bound, and on a stop the problems that stopped it.
// A step's state is said in its text, never by colour alone.
const STEP_WORDS = { done: "✓ ", current: "now: ", paused: "waiting on you: ", stopped: "stopped: ", todo: "" };

function progressRow(p) {
  const land = p.kind === "land";
  const round = land ? `landing${p.round ? ` L${p.round}` : ""}`
    : p.round ? `B${p.round}${p.limit ? ` of ${p.limit}` : ""}` : null;
  const steps = p.steps.map((s) => h("span", { class: `step ${s.state}` },
    `${STEP_WORDS[s.state] || ""}${s.label}`));
  const parts = [h("div", { class: "track" }, round ? h("span", { class: "r" }, round) : null, steps)];
  if (p.fraction !== null && p.fraction !== undefined) {
    // Inside the card's button a role would be dropped: the line under it says the same in text.
    parts.push(h("div", { class: "bar", "aria-hidden": "true" },
      h("div", { class: "fill", style: `width: ${Math.round(p.fraction * 100)}%` })));
    parts.push(h("div", { class: "meta" },
      `${dur(p.elapsed)} · ~${dur(p.typical)} typical · estimate (${p.samples} runs)`));
  } else if (p.elapsed !== null && p.elapsed !== undefined) {
    // No typical time to draw against (an open-ended step, or none in history): no bar, never a guess.
    parts.push(h("div", { class: "meta" }, `${dur(p.elapsed)} so far${p.running ? " · running" : ""}`));
  }
  if (p.plan) parts.push(h("div", { class: "meta" }, `plan: ${p.plan.touched} of ${p.plan.named} files touched`));
  if (land && p.train) parts.push(h("div", { class: "meta" }, `${p.train} in a train`));
  if (land && p.wait) parts.push(h("div", { class: "meta" }, p.wait));
  if (land && p.moves) parts.push(h("div", { class: "meta" }, `base moved ${p.moves} of ${p.limit || "?"} times`));
  for (const why of p.problems || []) parts.push(h("div", { class: "flag" }, `landing stopped: ${why}`));
  // A run stopped early goes to the approver with rounds left: each reason, in plain words.
  for (const s of (p.early && p.early.stuck) || []) parts.push(h("div", { class: "flag" }, `stopped early: kept two rounds running: ${s}`));
  for (const u of (p.early && p.early.untestable) || []) parts.push(h("div", { class: "flag" }, `stopped early: no test can show ${u}`));
  return h("div", { class: "progress" }, parts);
}

function card(c) {
  const have = c.artifacts.map((a) => a.replace(/\.md$/, "") + (c.unfilled.includes(a) ? "~" : ""));
  const meta = [
    c.tier ? `T${c.tier}` : "T?",
    have.join(" ") || "(empty)",
    c.open_questions ? `${c.open_questions} open question(s)` : null,
    c.undone.length ? `${c.undone.length} undone` : null,
    Object.keys(c.findings).length
      ? "findings " + Object.entries(c.findings).map(([k, n]) => `${n} ${k}`).join(", ") : null,
    c.checks ? `${c.checks} check(s)` : null,
    c.behind ? `behind by ${c.behind}` : null,
    ago(c.touched_ago),
  ].filter(Boolean).map((t) => h("span", {}, t));
  const flags = [];
  for (const p of c.problems || []) flags.push(h("div", { class: "flag" }, p));
  for (const p of (c.stopped && c.stopped.problems) || []) flags.push(h("div", { class: "flag" }, `stopped: ${p}`));
  // A signal flags the card only at the stage it belongs to, as its column does (board.py).
  for (const d of c.stage === "build" ? c.pending || [] : []) flags.push(h("div", { class: "flag" }, `${d.id} waits on you: ${d.text}`));
  if (c.stage === "test" && c.decision === "ESCALATE" && !c.answered) flags.push(h("div", { class: "flag" }, "the approver escalated it to you"));
  const factory = c.mode === "factory";
  // The approver's word is live only at `test`; past it (shipped, dropped) it is history.
  const chip = !c.decision ? null
    : c.stage === "test" ? c.decision
    : c.stage === "shipped" || c.stage === "dropped" ? `was ${c.decision}` : null;
  return h("button", { class: `card ${c.column}`, type: "button", "data-change": c.change },
    h("div", { class: "card-top" },
      h("span", { class: "num" }, c.id),
      h("span", { class: `badge ${c.mode}` }, factory ? "factory" : "by hand"),
      c.gate && c.gate.current ? h("span", { class: c.gate.verdict === "PASS" ? "badge gate-green" : "badge gate-red" },
        c.gate.verdict === "PASS" ? "gate green" : "gate red") : null,
      c.rebasing ? h("span", { class: "badge rebasing" }, "rebasing") : null,
      c.answered ? h("span", { class: "badge answered" }, "escalated: answered") : null,
      chip ? h("span", { class: "badge" }, chip) : null),
    h("div", { class: "title" }, c.title.replace(/^\d+\s*—\s*/, "") || c.slug),
    h("div", { class: "meta" }, meta),
    factory && c.rounds.length ? h("div", { class: "rounds" }, c.rounds.map(roundRow)) : null,
    factory && c.progress ? progressRow(c.progress) : null,
    factory && c.assumed.length ? h("div", { class: "meta" }, `${c.assumed.length} default(s) assumed`) : null,
    factory ? h("div", { class: "meta" }, money(c.cost)) : null,
    flags,
    c.needs && c.needs.length ? h("div", { class: "needs" }, `needs you: ${c.needs.join(" · ")}`) : null,
    h("div", { class: "next" }, "next: ", h("code", {}, c.next)));
}

// A count of seconds as the page shows it, so the render key changes only when what a person
// sees does: a poll that changes nothing on screen rebuilds nothing, and focus stays put.
function shownAs(k, v) {
  if (k === "touched_ago") return ago(v);
  if (k === "elapsed") return v === null || v === undefined ? v : dur(v);
  if (k === "fraction") return v === null || v === undefined ? v : Math.round(v * 100);
  return v;
}

let last = "";
let changes = [];
let shown = null;
function render(st) {
  shown = st;
  $("repo").textContent = `${st.repo} — open changes`;
  document.title = `${st.repo} · board`;
  const key = JSON.stringify([NARROW.matches, st.changes], shownAs);
  if (key === last) return;
  last = key;
  // The card that has focus gets it back once the cards are new nodes.
  const held = document.activeElement && document.activeElement.dataset
    ? document.activeElement.dataset.change : null;
  changes = st.changes;
  const cols = columnOrder().map((col) => {
    const cards = st.changes.filter((c) => c.column === col.key);
    return h("section", { class: `col ${col.key}`, "aria-label": col.label },
      h("div", { class: "col-head" }, h("h2", {}, col.label), h("span", { class: "who" }, col.who),
        h("span", { class: "count" }, cards.length || "")),
      cards.length ? cards.map(card) : h("div", { class: "empty" }, "nothing waiting here"));
  });
  $("board").replaceChildren(...cols);
  if (held && !open) {
    const back = document.querySelector(`[data-change="${CSS.escape(held)}"]`);
    if (back) back.focus();
  }
  const factory = st.changes.filter((c) => c.mode === "factory");
  const usd = factory.reduce((s, c) => s + (c.cost ? c.cost.usd : 0), 0);
  // A shipped or dropped change waits on close: no longer open, though its card stays.
  const openCount = st.changes.filter((c) => c.stage !== "shipped" && c.stage !== "dropped").length;
  $("totals").textContent = `${openCount} open · ${factory.length} by the factory` +
    (factory.length ? ` · $${usd.toFixed(2)} API-equivalent` : "");
}

// The status line is the page's one live region: its words change only when the board connects,
// drops, or its Needs you count moves, so a screen reader hears that and nothing each poll.
function say(text, down) {
  if ($("status").textContent !== text) $("status").textContent = text;
  $("status").className = down ? "status down" : "status";
}

async function poll() {
  try {
    const res = await fetch("/state.json", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const st = await res.json();
    render(st);
    const need = st.changes.filter((c) => c.column === "needs-you").length;
    // board.py changed under the server and wouldn't load: what shows is the code it had.
    say(st.reload_error ? `stale · ${st.reload_error}`
      : need ? `live · ${need} need${need === 1 ? "s" : ""} you` : "live", Boolean(st.reload_error));
    $("polled").textContent = new Date().toLocaleTimeString();
  } catch (e) {
    say("the board isn't answering: is `sdlc.py board` still running?", true);
  }
  setTimeout(poll, POLL_MS);
}

let open = null;
// The file the drawer shows: its path, and its text, or null while it loads or when it can't.
let doc = null;
// Whether a markdown file shows as its raw text, as the person last chose.
let raw = false;

// Which request the drawer waits on: a response to an older one is never shown.
let asking = 0;

function paint() {
  // An empty file, or one of only whitespace, has nothing to render, nor raw text to toggle to:
  // it says so instead.
  const empty = Boolean(doc && doc.text !== null && doc.text.trim() === "");
  const md = Boolean(doc && doc.text !== null && !empty && /\.md$/i.test(doc.path));
  $("d-raw").hidden = !md;
  $("d-raw").setAttribute("aria-pressed", String(raw));
  $("d-doc").replaceChildren(md && !raw
    ? h("div", { class: "md" }, renderMarkdown(doc.text, { base: doc.path, files: open ? open.files : [] }))
    : h("pre", {}, !doc ? "…" : empty ? "This file is empty." : doc.text ?? doc.note));
}

async function show(change, path) {
  for (const b of $("d-files").children) b.setAttribute("aria-current", String(b.dataset.path === path));
  const ask = ++asking;
  doc = null;
  paint();
  let got;
  try {
    const res = await fetch(`/file?change=${encodeURIComponent(change)}&path=${encodeURIComponent(path)}`,
      { cache: "no-store" });
    got = res.ok ? { path, text: await res.text() } : { path, text: null, note: `${path} can't be read (${res.status}).` };
  } catch (e) {
    got = { path, text: null, note: `${path} can't be read.` };
  }
  // Another file was asked for since: its own response paints the pane.
  if (ask !== asking) return;
  doc = got;
  paint();
}

function openDrawer(name) {
  const c = changes.find((x) => x.change === name);
  if (!c) return;
  open = c;
  $("d-title").textContent = c.title || c.change;
  $("d-links").replaceChildren(c.issue ? h("a", { href: c.issue, target: "_blank", rel: "noopener" }, "issue") : "");
  $("d-files").replaceChildren(...c.files.map((f) =>
    h("button", { type: "button", "data-path": f, "aria-current": "false" }, f)));
  $("scrim").hidden = $("drawer").hidden = false;
  const first = c.files.includes("intent.md") ? "intent.md" : c.files[0];
  if (first) show(c.change, first);
  else { asking++; doc = { path: "", text: null, note: "This folder holds no file yet." }; paint(); }
  $("d-close").focus();
}

function closeDrawer() {
  $("scrim").hidden = $("drawer").hidden = true;
  const back = open && document.querySelector(`[data-change="${CSS.escape(open.change)}"]`);
  open = null;
  if (back) back.focus();
}

$("board").addEventListener("click", (e) => {
  const b = e.target.closest(".card");
  if (b) openDrawer(b.dataset.change);
});
$("d-files").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b && open) show(open.change, b.dataset.path);
});
// A rendered link to another file of the change opens it here, and focus goes to the pane.
$("d-doc").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-path]");
  if (!a) return;
  e.preventDefault();
  if (open) { show(open.change, a.dataset.path); $("d-pane").focus(); }
});
$("d-raw").addEventListener("click", () => { raw = !raw; paint(); });
$("d-close").addEventListener("click", closeDrawer);
$("scrim").addEventListener("click", closeDrawer);
// The drawer is aria-modal: while it is open, Tab and Shift-Tab cycle its own focusable nodes.
const FOCUSABLE = 'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])';
function trapTab(e) {
  // A hidden node (the Raw toggle, for a file that isn't markdown) can't take focus.
  const nodes = [...$("drawer").querySelectorAll(FOCUSABLE)].filter((n) => !n.closest("[hidden]"));
  if (!nodes.length) return;
  const first = nodes[0], end = nodes[nodes.length - 1], at = document.activeElement;
  if (!$("drawer").contains(document.activeElement)) { e.preventDefault(); (e.shiftKey ? end : first).focus(); }
  else if (e.shiftKey && at === first) { e.preventDefault(); end.focus(); }
  else if (!e.shiftKey && at === end) { e.preventDefault(); first.focus(); }
}
document.addEventListener("keydown", (e) => {
  if (!open) return;
  if (e.key === "Escape") closeDrawer();
  else if (e.key === "Tab") trapTab(e);
});
NARROW.addEventListener("change", () => { if (shown) render(shown); });
poll();
</script>
</body>
</html>
