# Not a package: the plugin is installed by Claude Code, and `scripts/sdlc.py` declares its own
# runtime dependencies inline (PEP 723), which is how every skill runs it. This file only gives the
# repo's own tests an environment: `uv run --group dev pytest`.
[project]
name = "sdlc"
version = "1.10.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# The same two libraries the script declares, so the tests import exactly what it runs with, and
# pytest-xdist, which runs the suite across the cores (`-n auto`), and Playwright, which drives the
# board in a browser (tests/test_board_browser.py): test dependencies only, never a script's.
dev = [
  "pytest>=8",
  "pytest-xdist>=3",
  "playwright>=1.49",
  "ruff>=0.6",
  "python-frontmatter>=1.1",
  "PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Windows CI job runs only these: a test that must pass there too is marked, so the job's
# reach is written down rather than implied.
markers = [
  "portable: must pass on Windows too; the Windows CI job runs only these",
  "browser: drives a page in Chromium through Playwright; skips when the browser isn't installed",
]
